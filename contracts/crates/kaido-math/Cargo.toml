[package]
name = "kaido-math"
description = "Deterministic fixed-point math for Kaido: exp, erf, Gaussian L²-norm, λ-scaling, worst-case collateral. no_std, no f64 anywhere."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Plain Rust library — linked into the contract crates, not a contract itself.
crate-type = ["rlib"]

[dependencies]
# Intentionally dependency-free at runtime: kaido-math carries its own small,
# audited 256-bit `mul_div` / `isqrt` (module `fp`) rather than the script3
# `soroban-fixed-point-math` crate, because the script3 256-bit path
# (`SorobanFixedPoint`) requires a Soroban `Env` that this pure crate does not
# have. See ADR-1 ("kaido-math rounding & 256-bit intermediates"). The script3
# crate remains the dependency of record on the *contract* side for the money
# boundary.

[dev-dependencies]
# Property tests for the AMM invariants (build.md §4, §6 item 2).
proptest = "1"
# Parse the cross-language conformance vectors in docs/test-vectors/*.json.
# (Tests always link std, so these std-only deps are fine for a no_std crate.)
serde_json = "1"
