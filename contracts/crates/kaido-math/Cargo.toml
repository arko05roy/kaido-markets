[package]
name = "kaido-math"
description = "Deterministic fixed-point math for Kaido: exp, erf, Gaussian L²-norm, λ-scaling, worst-case collateral. no_std, no f64 anywhere."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Plain Rust library — linked into the contract crates, not a contract itself.
crate-type = ["rlib"]

