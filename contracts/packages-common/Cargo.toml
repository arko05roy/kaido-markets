[package]
name = "kaido-common"
description = "Shared Soroban types for Kaido: the Resolver trait, error enums, event topics, and market tuple types."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
