[package]
name = "kaido-integration-tests"
description = "Multi-contract integration tests for Kaido (factory → registry → house-vault → market → resolver lifecycles) against a local Soroban env / RPC, with mock SEP-40 oracle and mock resolvers for determinism."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
kaido-common = { workspace = true }
kaido-math = { workspace = true }
# Contract crates expose an `rlib` alongside `cdylib`, so lifecycle tests can
# register them directly. Wired up in Sprint 2 (see build.md §5 Sprint 2).
distribution-market = { path = "../contracts/distribution-market" }
market-factory = { path = "../contracts/market-factory" }
house-vault = { path = "../contracts/house-vault" }
registry = { path = "../contracts/registry" }
resolver-reflector = { path = "../contracts/resolver-reflector" }
resolver-attested = { path = "../contracts/resolver-attested" }
resolver-optimistic = { path = "../contracts/resolver-optimistic" }
resolver-designated = { path = "../contracts/resolver-designated" }
