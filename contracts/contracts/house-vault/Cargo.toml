[package]
name = "house-vault"
description = "HouseVault — protocol-owned underwriter that seeds markets as a Layer-1 LP-of-last-resort with per-market risk caps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
kaido-common = { workspace = true }
distribution-market = { path = "../distribution-market" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
kaido-math = { workspace = true }
