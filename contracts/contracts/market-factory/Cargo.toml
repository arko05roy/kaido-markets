[package]
name = "market-factory"
description = "MarketFactory — permissionless create_market(...) that deploys a DistributionMarket and registers it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
kaido-common = { workspace = true }
kaido-math = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
